{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">

Каталог фильмов

</h1>

<form method="get"
      class="row g-2 mb-4">

    <div class="col-md-4">

        <input type="text"
               name="search"
               class="form-control"
               placeholder="Поиск фильма">

    </div>

    <div class="col-md-3">

        <select
            name="genre"
            class="form-select">

            <option value="">
                Все жанры
            </option>

            {% for genre in genres %}

            <option value="{{ genre.id }}">

                {{ genre.name }}

            </option>

            {% endfor %}

        </select>

    </div>

    <div class="col-md-3">

        <select
        name="status"
        class="form-select">

            <option value="">
                Все статусы
            </option>

            <option value="published">
                Published
            </option>

            <option value="draft">
                Draft
            </option>

        </select>

    </div>

    <div class="col-md-2">

        <button
        class="btn btn-primary w-100">

            Найти

        </button>

    </div>

</form>

<div class="row">

{% for film in films %}

<div class="col-md-4 mb-4">

<div class="card shadow-sm h-100">

<div class="card-body">

<h4>

{{ film.title }}

</h4>

<p class="text-muted">

{{ film.genre }}

</p>

<p>

Год выпуска:
{{ film.release_year }}

</p>

<a href="{% url 'film_detail' film.pk %}"
class="btn btn-dark">

Подробнее

</a>

</div>

</div>

</div>

{% endfor %}

</div>

{% endblock %}
