<h1>Фильмотека</h1>

<a href="{% url 'film_create' %}">
    Добавить фильм
</a>

<hr>

{% for film in films %}
    <h3>
        <a href="{% url 'film_detail' film.pk %}">
            {{ film.title }}
        </a>
    </h3>

    <p>{{ film.genre }}</p>

    <hr>
{% empty %}
    <p>Фильмов пока нет</p>
{% endfor %}
